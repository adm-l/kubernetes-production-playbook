name: Validate Kubernetes manifests

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Render development overlay
        run: kubectl kustomize examples/go-api/overlays/dev
      - name: Client-side validation
        run: kubectl apply --dry-run=client -k examples/go-api/overlays/dev
